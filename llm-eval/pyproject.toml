[project]
name = "llm-eval"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pytest>=8.3,<9",
  "allure-pytest>=2.13,<3",
  "httpx>=0.28,<1",
  "openai>=1.57,<3",
  "boto3>=1.35,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--alluredir=../reports/allure-results/llm-eval --clean-alluredir"

[tool.ruff]
line-length = 110
