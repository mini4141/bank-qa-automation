kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # NodePort -> host port, so the API suite uses the same URLs as with Docker Compose
      - { containerPort: 30001, hostPort: 3001 }
      - { containerPort: 30002, hostPort: 3002 }
      - { containerPort: 30003, hostPort: 3003 }
      - { containerPort: 30080, hostPort: 8080 }
